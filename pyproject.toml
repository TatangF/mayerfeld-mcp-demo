[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mayerfeld-mcp-demo"
version = "0.1.0"
description = "Demo MCP: serveur de fichiers sandboxé, client et agent LLM (Mayerfeld Consulting)"
readme = "README.md"
requires-python = ">=3.10"
# mcp v2 a renommé FastMCP en MCPServer et changé d'autres API : on reste sur la v1.x.
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
agent = ["google-genai>=2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mayerfeld-mcp-server = "mayerfeld_mcp.server:main"
mayerfeld-mcp-client = "mayerfeld_mcp.client:main"
mayerfeld-mcp-agent = "mayerfeld_mcp.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
